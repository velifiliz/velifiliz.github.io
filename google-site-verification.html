    Bu dosya Google Search Console doğrulaması için oluşturulmuştur.
    
    KULLANIM:
    1. Google Search Console'a gidin: https://search.google.com/search-console
    2. "Mülk ekle" butonuna tıklayın
    3. "URL öneki" seçeneğini seçin ve https://velifiliz.github.io yazın
    4. Doğrulama yöntemlerinden "HTML dosyası" seçeneğini seçin
    5. Google'ın verdiği dosyayı indirin (örn: google1234567890abcdef.html)
    6. O dosyayı bu klasöre yükleyin
    7. GitHub'a push edin
    8. Google Search Console'da "Doğrula" butonuna tıklayın
    -->
